name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm Trusted Publishing requires npm >=11.5.1 and Node >=22.14.0.
      # https://docs.npmjs.com/trusted-publishers/
      - name: Install an OIDC-compatible npm CLI
        run: npm install --global npm@11

      - name: Validate the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          assert.equal(pkg.name, '@shamah/opencode-agentrouter');
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package.json version');
          assert.equal(pkg.repository.url, 'git+https://github.com/shamahdev/opencode-agentrouter.git');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # prepack builds dist/; npm automatically adds provenance when publishing with OIDC.
      # No NPM_TOKEN or NODE_AUTH_TOKEN secret is needed.
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
